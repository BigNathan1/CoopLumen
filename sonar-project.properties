# SonarCloud analysis configuration, consumed by the `sonarcloud` job in
# .github/workflows/ci.yml. Create the project at https://sonarcloud.io and
# confirm the organization and project key below match it.
sonar.organization=bignathan1
sonar.projectKey=BigNathan1_CoopLumen
sonar.projectName=CoopLumen

sonar.sources=backend/src,frontend/src
sonar.tests=backend/src,frontend/src,frontend/e2e
sonar.test.inclusions=**/__tests__/**,**/*.test.ts,**/*.test.tsx,**/*.spec.ts,frontend/e2e/**

sonar.exclusions=**/node_modules/**,**/dist/**,**/.next/**,**/coverage/**,**/target/**,**/*.d.ts,backend/src/db/migrations/**
sonar.coverage.exclusions=**/__tests__/**,**/*.test.ts,**/*.test.tsx,**/*.spec.ts,frontend/e2e/**,backend/src/index.ts,backend/src/db/migrate.ts,backend/src/db/seed.ts

# Written by `jest --coverage` in the test jobs and handed over as an artifact.
sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info,frontend/coverage/lcov.info

sonar.sourceEncoding=UTF-8
