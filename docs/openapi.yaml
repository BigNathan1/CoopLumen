openapi: 3.0.3
info:
  title: CoopLumen API
  description: REST API for CoopLumen communities and Stellar assets.
  version: 0.1.0
servers:
  - url: http://localhost:4000

tags:
  - name: Tokens
    description: Community token metadata and operations
  - name: Balances
    description: Stellar account balances and related balance views
  - name: Prices
    description: Public market price feeds for Stellar assets
  - name: Accounts
    description: Full Stellar account details and state
  - name: Transactions
    description: Stellar transaction submission endpoints
  - name: Communities
    description: Community registration and management
  - name: Members
    description: Community membership management
  - name: Treasury
    description: Community treasury balances
  - name: Loans
    description: Peer-to-peer loan lifecycle within a community
  - name: Webhooks
    description: Inbound webhook endpoints for Stellar account/transaction event notifications

paths:
  /api/v1/communities:
    get:
      tags: [Communities]
      summary: List communities
      description: Paginated, optionally full-text-searched list of active communities.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - name: search
          in: query
          schema: { type: string }
          description: Full-text search over name and description.
        - name: sortBy
          in: query
          schema:
            type: string
            enum: [created_at, name, updated_at]
            default: created_at
        - name: order
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: desc
      responses:
        '200':
          description: A page of communities
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Community' }
                  meta: { $ref: '#/components/schemas/PageMeta' }
    post:
      tags: [Communities]
      summary: Register a community
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateCommunity' }
      responses:
        '201':
          description: Community created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Community' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '409':
          description: Community name already taken

  /api/v1/communities/search:
    get:
      tags: [Communities]
      summary: Search communities
      description: Dedicated full-text search over community name and description.
      parameters:
        - name: q
          in: query
          required: true
          description: Search query text; 400 if missing or blank.
          schema: { type: string }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of matching communities
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Community' }
                  meta: { $ref: '#/components/schemas/PageMeta' }
        '400':
          description: Missing or blank `q` query parameter

  /api/v1/prices/xlm:
    get:
      tags: [Prices]
      summary: Get XLM price
      description: >
        Returns current XLM market price (default XLM/USD) fetched from public market data providers.
        Responses may be served from a Redis cache for up to 30 seconds.
      parameters:
        - name: currency
          in: query
          required: false
          description: Target fiat/quote currency (e.g., USD, EUR, GBP). Defaults to USD.
          schema:
            type: string
            pattern: '^[A-Za-z]{3,4}$'
            default: USD
      responses:
        '200':
          description: Current market price for XLM
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceResponse'
        '400': { $ref: '#/components/responses/ValidationError' }
        '502':
          description: Failed to fetch price from public source
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/accounts/{publicKey}:
    parameters:
      - name: publicKey
        in: path
        required: true
        description: Stellar public key of the account to inspect.
        schema:
          $ref: '#/components/schemas/StellarKey'
    get:
      tags: [Accounts]
      summary: Get full Stellar account details
      description: >
        Returns full Stellar account details from Horizon for the given public key,
        including sequence number, balances, signers, thresholds, flags, and account data entries.
      responses:
        '200':
          description: Full account details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountDetailsResponse'
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '502':
          description: Horizon is temporarily unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/balances/{publicKey}:
    parameters:
      - name: publicKey
        in: path
        required: true
        description: Stellar public key of the account to inspect.
        schema:
          $ref: '#/components/schemas/StellarKey'
    get:
      tags: [Balances]
      summary: Get account balances
      description: >
        Returns all on-chain balances for a Stellar account. Successful responses
        may be served from a Redis cache for up to 5 seconds; the response body
        itself is unchanged.
      responses:
        '200':
          description: Account balances
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BalanceResponse'
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '502':
          description: Horizon is temporarily unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/balances/{publicKey}/history:
    parameters:
      - name: publicKey
        in: path
        required: true
        description: Stellar public key whose audit history should be returned.
        schema:
          $ref: '#/components/schemas/StellarKey'
    get:
      tags: [Balances]
      summary: Get balance-change audit history
      description: >
        Returns transactions_log audit entries associated with the Stellar
        address, ordered newest first. Action-specific balance information is
        preserved in each entry's metadata object.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Paginated balance-change audit history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BalanceHistoryResponse'
        '400': { $ref: '#/components/responses/ValidationError' }
        '500':
          description: Audit history could not be queried
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/balances/{publicKey}/loans:
    parameters:
      - name: publicKey
        in: path
        required: true
        description: Stellar public key to look up as either borrower or lender.
        schema:
          $ref: '#/components/schemas/StellarKey'
    get:
      tags: [Balances, Loans]
      summary: List loans involving an address
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of loans where the address is borrower or lender
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Loan' }
                  meta: { $ref: '#/components/schemas/PageMeta' }
        '400': { $ref: '#/components/responses/ValidationError' }

  /api/v1/balances/community/{communityId}/loans:
    parameters:
      - $ref: '#/components/parameters/CommunityId'
    get:
      tags: [Balances, Loans]
      summary: List loans in a community
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of loans belonging to the community
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Loan' }
                  meta: { $ref: '#/components/schemas/PageMeta' }
        '400': { $ref: '#/components/responses/ValidationError' }

  /api/v1/tokens/transfer:
    post:
      tags: [Transactions]
      summary: Submit a signed Stellar payment transaction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenTransferRequest'
      responses:
        '200':
          description: Payment submitted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenTransferResponse'
        '400': { $ref: '#/components/responses/ValidationError' }
        '402':
          description: The source account does not have enough XLM for the payment and fee
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InsufficientBalanceResponse'
        '422':
          description: The Stellar network rejected the signed transaction
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Horizon is temporarily unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/webhooks/stellar:
    post:
      tags: [Webhooks]
      summary: Receive a Stellar account/transaction event notification
      description: >
        Accepts event notifications from a trusted Stellar webhook source
        (e.g. a Horizon-event forwarder). The request must carry an
        `X-Stellar-Webhook-Signature` header containing the hex-encoded
        HMAC-SHA256 digest of the raw request body, keyed with the server's
        `STELLAR_WEBHOOK_SECRET`. The signature is verified before the body
        is validated, so a request with an invalid signature never reaches
        payload validation.
      parameters:
        - name: X-Stellar-Webhook-Signature
          in: header
          required: true
          description: Hex-encoded HMAC-SHA256 digest of the raw request body.
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StellarWebhookPayload'
      responses:
        '200':
          description: Event accepted
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [received, eventId]
                    properties:
                      received: { type: boolean, example: true }
                      eventId: { type: string }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401':
          description: Missing or invalid webhook signature
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: The server has no webhook secret configured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/transactions/unsigned:
    post:
      tags: [Transactions]
      summary: Build an unsigned Stellar payment transaction
      description: >
        Loads the source account and its current sequence number from Horizon,
        then returns a single-operation payment transaction XDR for wallet signing.
        The transaction is not signed or submitted by this endpoint.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UnsignedPaymentRequest'
      responses:
        '200':
          description: Unsigned payment transaction built successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnsignedPaymentResponse'
        '400': { $ref: '#/components/responses/ValidationError' }
        '404':
          description: The source Stellar account does not exist on the configured network
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Horizon is temporarily unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/trustlines/build:
    post:
      tags: [Transactions, Tokens]
      summary: Build an unsigned Stellar trustline establishment transaction
      description: >
        Loads the account and its current sequence number from Horizon,
        then returns a single-operation changeTrust transaction XDR for wallet signing.
        The transaction is not signed or submitted by this endpoint.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BuildTrustlineRequest'
      responses:
        '200':
          description: Unsigned trustline transaction built successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BuildTrustlineResponse'
        '400': { $ref: '#/components/responses/ValidationError' }
        '404':
          description: The Stellar account does not exist on the configured network
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Horizon is temporarily unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/tokens/airdrop:
    post:
      tags: [Transactions]
      summary: Airdrop a community token to all community members
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AirdropRequest'
      responses:
        '200':
          description: Airdrop submitted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AirdropResponse'
        '400': { $ref: '#/components/responses/ValidationError' }
        '402':
          description: The issuer account does not have enough XLM for transaction fees
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InsufficientBalanceResponse'
        '404': { $ref: '#/components/responses/NotFound' }
        '422':
          description: The Stellar network rejected the airdrop transaction
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Horizon is temporarily unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/tokens/{assetCode}/{issuer}:
    get:
      tags: [Tokens]
      summary: Get token metadata
      description: Returns the off-chain metadata for one Stellar custom asset.
      parameters:
        - name: assetCode
          in: path
          required: true
          description: Stellar asset code.
          schema:
            type: string
            pattern: '^[A-Za-z0-9]{1,12}$'
        - name: issuer
          in: path
          required: true
          description: Stellar public key of the asset issuer.
          schema:
            type: string
            pattern: '^G[A-Z2-7]{55}$'
      responses:
        '200':
          description: Token metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenMetadataResponse'
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/tokens/{communityId}:
    get:
      tags: [Tokens]
      summary: List tokens issued for a community
      parameters:
        - name: communityId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Tokens issued for the community
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Token' }

  /api/v1/tokens/burn:
    post:
      tags: [Tokens]
      summary: Burn tokens
      description: Reduces circulating supply by returning tokens to the issuing account.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BurnToken' }
      responses:
        '200':
          description: Tokens burned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenTransferResponse'
        '400': { $ref: '#/components/responses/ValidationError' }
        '502':
          description: Horizon is temporarily unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/tokens/trustline:
    post:
      tags: [Tokens]
      summary: Establish a trustline
      description: Allows an account to hold a community token; must be called before it can receive the asset.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [accountSecret, assetCode, assetIssuer]
              properties:
                accountSecret: { type: string }
                assetCode: { type: string }
                assetIssuer: { $ref: '#/components/schemas/StellarKey' }
                limit: { type: string }
      responses:
        '201':
          description: Trustline established
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenTransferResponse'
        '400': { $ref: '#/components/responses/ValidationError' }
        '502':
          description: Horizon is temporarily unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/tokens/holders/{assetCode}/{issuer}:
    parameters:
      - name: assetCode
        in: path
        required: true
        schema: { type: string, pattern: '^[A-Za-z0-9]{1,12}$' }
      - name: issuer
        in: path
        required: true
        schema: { $ref: '#/components/schemas/StellarKey' }
    get:
      tags: [Tokens]
      summary: List accounts holding a token
      description: Backed by Horizon's asset endpoint.
      responses:
        '200':
          description: Accounts holding the asset
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        account: { $ref: '#/components/schemas/StellarKey' }
                        balance: { type: string }
        '400': { $ref: '#/components/responses/ValidationError' }
        '502':
          description: Horizon is temporarily unavailable

  /api/v1/tokens/supply/{assetCode}/{issuer}:
    parameters:
      - name: assetCode
        in: path
        required: true
        schema: { type: string, pattern: '^[A-Za-z0-9]{1,12}$' }
      - name: issuer
        in: path
        required: true
        schema: { $ref: '#/components/schemas/StellarKey' }
    get:
      tags: [Tokens]
      summary: Get circulating supply
      description: Returns the circulating supply Horizon reports for the asset.
      responses:
        '200':
          description: Circulating supply
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      assetCode: { type: string }
                      issuer: { $ref: '#/components/schemas/StellarKey' }
                      supply: { type: string }
        '400': { $ref: '#/components/responses/ValidationError' }
        '502':
          description: Horizon is temporarily unavailable

  /api/v1/tokens/history/{assetCode}/{issuer}:
    parameters:
      - name: assetCode
        in: path
        required: true
        schema: { type: string, pattern: '^[A-Za-z0-9]{1,12}$' }
      - name: issuer
        in: path
        required: true
        schema: { $ref: '#/components/schemas/StellarKey' }
    get:
      tags: [Tokens]
      summary: Get recent payment activity for a token
      description: >
        Horizon has no dedicated "payments for an asset" endpoint, so this
        proxies the issuer account's payment history filtered to the asset.
      responses:
        '200':
          description: Recent payment activity
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { type: object }
        '400': { $ref: '#/components/responses/ValidationError' }

  /api/v1/communities/{id}:
    parameters:
      - $ref: '#/components/parameters/CommunityId'
    get:
      tags: [Communities]
      summary: Get a community
      description: Enriched with member count, token list, and statistics.
      responses:
        '200':
          description: Community detail
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/CommunityDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Communities]
      summary: Update a community
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateCommunity' }
      responses:
        '200':
          description: Updated community
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Community name already taken
    delete:
      tags: [Communities]
      summary: Soft-delete a community
      responses:
        '200':
          description: Community soft-deleted
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/communities/{id}/avatar:
    parameters:
      - $ref: '#/components/parameters/CommunityId'
    post:
      tags: [Communities]
      summary: Set community avatar URL
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [avatarUrl]
              properties:
                avatarUrl:
                  type: string
                  format: uri
                  maxLength: 2048
      responses:
        '200':
          description: Avatar updated
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/communities/{id}/members:
    parameters:
      - $ref: '#/components/parameters/CommunityId'
    get:
      tags: [Members]
      summary: List members
      description: Paginated member list for a community, optionally filtered by role.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - name: role
          in: query
          schema:
            type: string
            enum: [admin, treasurer, member, observer]
          description: Restricts the list to a single role. Unrecognized values are ignored.
      responses:
        '200':
          description: A page of members
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Member' }
                  meta: { $ref: '#/components/schemas/PageMeta' }
    post:
      tags: [Members]
      summary: Add a member
      description: >
        Adds a member to the community. Re-adding a previously removed
        (soft-deleted) address reactivates it with the given role instead of
        failing on the unique constraint.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [stellarAddress]
              properties:
                stellarAddress: { $ref: '#/components/schemas/StellarKey' }
                role:
                  type: string
                  enum: [admin, treasurer, member, observer]
                  default: member
      responses:
        '201':
          description: Member added
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Member' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/communities/{id}/members/{address}:
    parameters:
      - $ref: '#/components/parameters/CommunityId'
      - name: address
        in: path
        required: true
        schema: { $ref: '#/components/schemas/StellarKey' }
        description: Stellar public key of the member. Rejected with 400 if not a structurally valid 56-character StrKey.
    get:
      tags: [Members]
      summary: Get a member
      responses:
        '200':
          description: Member detail
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Member' }
        '400':
          description: The address path parameter is not a structurally valid Stellar StrKey
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Members]
      summary: Update a member's role
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role:
                  type: string
                  enum: [admin, treasurer, member, observer]
      responses:
        '200':
          description: Member updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Member' }
        '400':
          description: >
            The role in the request body failed validation, or the address
            path parameter is not a structurally valid Stellar StrKey
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Members]
      summary: Remove a member
      description: Soft-removes a member; the address can be re-added later via POST.
      responses:
        '200':
          description: Member soft-removed
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      stellar_address: { $ref: '#/components/schemas/StellarKey' }
                      removed: { type: boolean, example: true }
        '400':
          description: The address path parameter is not a structurally valid Stellar StrKey
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/communities/{id}/treasury:
    parameters:
      - $ref: '#/components/parameters/CommunityId'
    get:
      tags: [Treasury]
      summary: Get treasury balances
      description: Returns the issuer account's on-chain Stellar balances, fetched live from Horizon.
      responses:
        '200':
          description: Treasury balances
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      account: { $ref: '#/components/schemas/StellarKey' }
                      balances:
                        type: array
                        items:
                          type: object
                          properties:
                            asset_type: { type: string }
                            asset_code: { type: string }
                            asset_issuer: { type: string }
                            balance: { type: string }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/tokens/issue:
    post:
      tags: [Tokens]
      summary: Issue a community token
      description: >
        Issues a community token on the Stellar network. Accepts an optional
        Idempotency-Key header; a retried request with the same key replays
        the original response instead of issuing a second time.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IssueToken' }
      responses:
        '201':
          description: Token issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenTransferResponse'
        '400': { $ref: '#/components/responses/ValidationError' }
        '500':
          description: The asset was issued but its metadata could not be persisted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Horizon is temporarily unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/loans:
    get:
      tags: [Loans]
      summary: List loans
      description: Paginated, filterable list of loans.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - name: communityId
          in: query
          schema: { type: string, format: uuid }
        - name: borrower
          in: query
          schema: { $ref: '#/components/schemas/StellarKey' }
        - name: lender
          in: query
          schema: { $ref: '#/components/schemas/StellarKey' }
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, active, repaid, defaulted, cancelled]
        - name: sortBy
          in: query
          schema:
            type: string
            enum: [created_at, amount, due_at, updated_at]
            default: created_at
        - name: order
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: desc
      responses:
        '200':
          description: A page of loans
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Loan' }
                  meta: { $ref: '#/components/schemas/PageMeta' }
    post:
      tags: [Loans]
      summary: Create a loan request
      description: Records a new loan in `pending` status and seeds its event log.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateLoan' }
      responses:
        '201':
          description: Loan created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Loan' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/loans/{id}:
    parameters:
      - $ref: '#/components/parameters/LoanId'
    get:
      tags: [Loans]
      summary: Get a loan
      description: Enriched with its full event history and outstanding balance.
      responses:
        '200':
          description: Loan detail
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    allOf:
                      - $ref: '#/components/schemas/Loan'
                      - type: object
                        properties:
                          outstanding: { type: string }
                          events:
                            type: array
                            items: { $ref: '#/components/schemas/LoanEvent' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Loans]
      summary: Cancel a loan
      description: Cancels a loan that has not yet been disbursed (status `pending`).
      responses:
        '200':
          description: Loan cancelled
        '404':
          description: No pending loan found to cancel

  /api/v1/loans/{id}/events:
    parameters:
      - $ref: '#/components/parameters/LoanId'
    get:
      tags: [Loans]
      summary: List loan events
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of loan events
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/LoanEvent' }
                  meta: { $ref: '#/components/schemas/PageMeta' }

  /api/v1/loans/{id}/disburse:
    parameters:
      - $ref: '#/components/parameters/LoanId'
    post:
      tags: [Loans]
      summary: Disburse a loan
      description: Transitions a `pending` loan to `active` once funds have been sent.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                stellarTxHash: { type: string }
                note: { type: string }
      responses:
        '200':
          description: Loan disbursed
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Loan' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Loan is not in `pending` status

  /api/v1/loans/{id}/repay:
    parameters:
      - $ref: '#/components/parameters/LoanId'
    post:
      tags: [Loans]
      summary: Record a loan repayment
      description: >
        Records a partial or full repayment. When the outstanding balance
        reaches zero the loan is marked `repaid`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount]
              properties:
                amount: { type: string }
                paymentId: { type: string, format: uuid }
                note: { type: string }
      responses:
        '200':
          description: Repayment recorded
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Loan' }
        '400':
          description: Repayment exceeds the outstanding balance, or validation failed
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Loan is not in `active` status

  /api/v1/loans/{id}/default:
    parameters:
      - $ref: '#/components/parameters/LoanId'
    post:
      tags: [Loans]
      summary: Mark a loan as defaulted
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                note: { type: string }
      responses:
        '200':
          description: Loan marked as defaulted
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Loan' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Loan is not in `active` status

components:
  parameters:
    CommunityId:
      name: id
      in: path
      required: true
      description: Community UUID.
      schema: { type: string, format: uuid }
    LoanId:
      name: id
      in: path
      required: true
      description: Loan UUID.
      schema: { type: string, format: uuid }
    Page:
      name: page
      in: query
      description: 1-based page number.
      schema: { type: integer, minimum: 1, default: 1 }
    Limit:
      name: limit
      in: query
      description: Page size, capped at 100.
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
  responses:
    ValidationError:
      description: Request validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationErrorResponse'
    NotFound:
      description: Requested resource was not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    StellarKey:
      type: string
      description: A 56-character Stellar StrKey public key.
      pattern: '^G[A-Z2-7]{55}$'
    BalanceLine:
      type: object
      properties:
        asset_type: { type: string }
        asset_code: { type: string, nullable: true }
        asset_issuer: { type: string, nullable: true }
        balance: { type: string }
    BalanceResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/BalanceLine'
    BalanceHistoryEntry:
      type: object
      required: [id, community_id, actor_address, action, stellar_tx_hash, metadata, created_at]
      properties:
        id: { type: string, format: uuid }
        community_id: { type: string, format: uuid, nullable: true }
        actor_address:
          allOf:
            - $ref: '#/components/schemas/StellarKey'
          nullable: true
        action:
          type: string
          description: Audit action such as payment_sent, token_issued, or loan_repayment.
        stellar_tx_hash: { type: string, nullable: true }
        metadata:
          type: object
          nullable: true
          additionalProperties: true
          description: Action-specific values such as amount, asset_code, or loan_id.
        created_at: { type: string, format: date-time }
    BalanceHistoryResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/BalanceHistoryEntry'
        meta:
          $ref: '#/components/schemas/PageMeta'
    Health:
      type: object
      properties:
        status: { type: string, example: ok }
        db: { type: string, example: ok }
        stellar: { type: string, example: ok }
        uptime: { type: integer }
        version: { type: string }
    Community:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string, nullable: true }
        issuer_public_key: { $ref: '#/components/schemas/StellarKey' }
        asset_code: { type: string }
        asset_issuer: { $ref: '#/components/schemas/StellarKey' }
        avatar_url: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    Member:
      type: object
      properties:
        stellar_address: { $ref: '#/components/schemas/StellarKey' }
        role:
          type: string
          enum: [admin, treasurer, member, observer]
        joined_at: { type: string, format: date-time }
    CommunityDetail:
      allOf:
        - $ref: '#/components/schemas/Community'
        - type: object
          properties:
            member_count: { type: integer }
            tokens:
              type: array
              items: { type: object }
            stats:
              type: object
              properties:
                total_transactions: { type: integer }
                total_token_supply: { type: number }
    CreateCommunity:
      type: object
      required: [name, issuerPublicKey, assetCode, assetIssuer]
      properties:
        name: { type: string, minLength: 2, maxLength: 64 }
        description: { type: string, maxLength: 500 }
        issuerPublicKey: { $ref: '#/components/schemas/StellarKey' }
        assetCode: { type: string, minLength: 1, maxLength: 12 }
        assetIssuer: { $ref: '#/components/schemas/StellarKey' }
    UpdateCommunity:
      type: object
      properties:
        name: { type: string, minLength: 2, maxLength: 64 }
        description: { type: string, nullable: true, maxLength: 500 }
        settings: { type: object, additionalProperties: true }
    PageMeta:
      type: object
      properties:
        total: { type: integer }
        page: { type: integer }
        limit: { type: integer }
        pages: { type: integer }
        offset: { type: integer }
    ValidationIssue:
      type: object
      properties:
        path:
          oneOf:
            - type: string
            - type: array
              items: { type: string }
        message: { type: string }
    ValidationErrorResponse:
      type: object
      required: [data, error]
      properties:
        data:
          nullable: true
        meta:
          type: object
          properties:
            errors:
              type: array
              items:
                $ref: '#/components/schemas/ValidationIssue'
        error:
          oneOf:
            - type: string
            - type: object
              additionalProperties: true
    Error:
      type: object
      properties:
        error: { type: string }
    StellarWebhookPayload:
      type: object
      required: [eventId, eventType, occurredAt, data]
      properties:
        eventId:
          type: string
          minLength: 1
        eventType:
          type: string
          enum:
            - transaction.succeeded
            - transaction.failed
            - account.created
            - trustline.created
            - trustline.removed
            - payment.received
        occurredAt:
          type: string
          format: date-time
        data:
          type: object
          additionalProperties: true
    TokenTransferRequest:
      type: object
      required: [signedXdr]
      properties:
        signedXdr:
          type: string
          minLength: 1
          maxLength: 100000
    TokenTransferResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          properties:
            txHash: { type: string }
    UnsignedPaymentRequest:
      type: object
      required: [senderPublicKey, destinationPublicKey, assetCode, amount]
      properties:
        senderPublicKey:
          $ref: '#/components/schemas/StellarKey'
        destinationPublicKey:
          $ref: '#/components/schemas/StellarKey'
        assetCode:
          type: string
          pattern: '^[A-Za-z0-9]{1,12}$'
          description: Use XLM for the native asset.
        assetIssuer:
          allOf:
            - $ref: '#/components/schemas/StellarKey'
          description: Required for non-XLM assets and omitted for native XLM.
        amount:
          type: string
          pattern: '^(?:0|[1-9]\d*)(?:\.\d{1,7})?$'
          description: Positive decimal amount with up to 7 fractional digits.
        memo:
          type: string
          description: Optional text memo of at most 28 UTF-8 bytes.
      example:
        senderPublicKey: GCFIRY65OQE7DFP5KLNS2PF2LVZMUZYJX4OZIEQ36N2IQANUB5XVYOJR
        destinationPublicKey: GCATS5YOVB6ROX2WUNKGNQ2MP3GMXDMKSG2O4N5CLX3A6W4PZGZZI55U
        assetCode: XLM
        amount: '10.5'
        memo: Community payment
    UnsignedPaymentResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [xdr]
          properties:
            xdr:
              type: string
              description: Base64-encoded unsigned Stellar transaction envelope XDR.
    BuildTrustlineRequest:
      type: object
      required: [accountPublicKey, assetCode, assetIssuer]
      properties:
        accountPublicKey:
          $ref: '#/components/schemas/StellarKey'
          description: Stellar public key of the account establishing the trustline.
        assetCode:
          type: string
          pattern: '^[A-Za-z0-9]{1,12}$'
          description: Stellar asset code to trust.
        assetIssuer:
          $ref: '#/components/schemas/StellarKey'
          description: Stellar public key of the asset issuer.
        limit:
          type: string
          pattern: '^(?:0|[1-9]\d*)(?:\.\d{1,7})?$'
          description: Optional maximum amount of the asset to trust.
      example:
        accountPublicKey: GCFIRY65OQE7DFP5KLNS2PF2LVZMUZYJX4OZIEQ36N2IQANUB5XVYOJR
        assetCode: COOP
        assetIssuer: GCATS5YOVB6ROX2WUNKGNQ2MP3GMXDMKSG2O4N5CLX3A6W4PZGZZI55U
        limit: '1000'
    BuildTrustlineResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [xdr]
          properties:
            xdr:
              type: string
              description: Base64-encoded unsigned Stellar transaction envelope XDR.
    AirdropRequest:
      type: object
      required: [communityId, amount, issuerSecret]
      properties:
        communityId:
          type: string
          format: uuid
        amount:
          type: string
          description: Positive decimal amount with up to 7 fractional digits.
        issuerSecret:
          type: string
          description: Stellar secret key for the issuing account.
    AirdropResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          properties:
            amount: { type: string }
            recipientCount: { type: integer }
            txHashes:
              type: array
              items: { type: string }
    InsufficientBalanceError:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          example: INSUFFICIENT_BALANCE
        message:
          type: string
        requiredXlm:
          type: string
          nullable: true
        currentBalance:
          type: string
          nullable: true
    InsufficientBalanceResponse:
      type: object
      required: [data, error]
      properties:
        data:
          nullable: true
        error:
          $ref: '#/components/schemas/InsufficientBalanceError'
    Token:
      type: object
      properties:
        id: { type: string, format: uuid }
        community_id: { type: string, format: uuid }
        asset_code: { type: string }
        asset_issuer: { $ref: '#/components/schemas/StellarKey' }
        distributor_address: { $ref: '#/components/schemas/StellarKey' }
        total_supply: { type: string }
        description: { type: string, nullable: true }
        icon_url: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    BurnToken:
      type: object
      required: [asset_code, asset_issuer]
      properties:
        id:
          type: string
        community_id:
          type: string
          format: uuid
        asset_code:
          type: string
        asset_issuer:
          type: string
        name:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    TokenMetadata:
      type: object
      properties:
        id: { type: string, format: uuid }
        asset_code: { type: string }
        asset_issuer: { $ref: '#/components/schemas/StellarKey' }
        name: { type: string }
        description: { type: string, nullable: true }
    TokenMetadataResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/TokenMetadata'
    IssueToken:
      type: object
      required: [issuerSecret, assetCode, distributorPublicKey, amount]
      properties:
        communityId: { type: string, format: uuid }
        issuerSecret: { type: string }
        assetCode: { type: string, minLength: 1, maxLength: 12 }
        distributorPublicKey: { $ref: '#/components/schemas/StellarKey' }
        amount: { type: string }
        memo: { type: string, maxLength: 28 }
    ErrorResponse:
      type: object
      required: [data, error]
      properties:
        data:
          nullable: true
        meta:
          type: object
          additionalProperties: true
        error:
          oneOf:
            - type: string
            - type: object
              additionalProperties: true
    Loan:
      type: object
      properties:
        id: { type: string, format: uuid }
        community_id: { type: string, format: uuid }
        borrower_address: { $ref: '#/components/schemas/StellarKey' }
        lender_address: { $ref: '#/components/schemas/StellarKey' }
        amount: { type: string }
        amount_repaid: { type: string }
        asset_code: { type: string }
        asset_issuer: { $ref: '#/components/schemas/StellarKey' }
        purpose: { type: string, nullable: true }
        status:
          type: string
          enum: [pending, active, repaid, defaulted, cancelled]
        due_at: { type: string, format: date-time, nullable: true }
        disbursed_at: { type: string, format: date-time, nullable: true }
        closed_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    LoanEvent:
      type: object
      properties:
        id: { type: string, format: uuid }
        loan_id: { type: string, format: uuid }
        event_type:
          type: string
          enum: [created, disbursed, repayment, closed, defaulted]
        amount: { type: string, nullable: true }
        payment_id: { type: string, format: uuid, nullable: true }
        note: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
    CreateLoan:
      type: object
      required: [communityId, borrowerAddress, lenderAddress, amount, assetCode]
      properties:
        communityId: { type: string, format: uuid }
        borrowerAddress: { $ref: '#/components/schemas/StellarKey' }
        lenderAddress: { $ref: '#/components/schemas/StellarKey' }
        amount: { type: string }
        assetCode: { type: string, minLength: 1, maxLength: 12 }
        assetIssuer: { $ref: '#/components/schemas/StellarKey' }
        purpose: { type: string, maxLength: 280 }
        dueAt: { type: string, format: date-time }
    PriceData:
      type: object
      required: [asset, currency, price, source, timestamp]
      properties:
        asset:
          type: string
          example: XLM
        currency:
          type: string
          example: USD
        price:
          type: string
          example: '0.1888200'
        source:
          type: string
          example: coingecko
        timestamp:
          type: string
          format: date-time
    PriceResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/PriceData'
    AccountThresholds:
      type: object
      properties:
        low_threshold: { type: integer }
        med_threshold: { type: integer }
        high_threshold: { type: integer }
    AccountFlags:
      type: object
      properties:
        auth_required: { type: boolean }
        auth_revocable: { type: boolean }
        auth_immutable: { type: boolean }
        auth_clawback_enabled: { type: boolean }
    AccountSigner:
      type: object
      properties:
        key: { type: string }
        weight: { type: integer }
        type: { type: string }
        sponsor: { type: string }
    AccountBalanceLine:
      type: object
      properties:
        asset_type: { type: string }
        balance: { type: string }
        limit: { type: string }
        buying_liabilities: { type: string }
        selling_liabilities: { type: string }
        asset_code: { type: string }
        asset_issuer: { type: string }
        last_modified_ledger: { type: integer }
        is_authorized: { type: boolean }
        is_authorized_to_maintain_liabilities: { type: boolean }
        is_clawback_enabled: { type: boolean }
        sponsor: { type: string }
    AccountDetails:
      type: object
      required:
        - id
        - account_id
        - sequence
        - subentry_count
        - last_modified_ledger
        - thresholds
        - flags
        - balances
        - signers
        - data
      properties:
        id: { $ref: '#/components/schemas/StellarKey' }
        account_id: { $ref: '#/components/schemas/StellarKey' }
        sequence: { type: string }
        sequence_ledger: { type: integer }
        sequence_time: { type: string }
        subentry_count: { type: integer }
        inflation_destination: { type: string }
        home_domain: { type: string }
        last_modified_ledger: { type: integer }
        last_modified_time: { type: string }
        thresholds: { $ref: '#/components/schemas/AccountThresholds' }
        flags: { $ref: '#/components/schemas/AccountFlags' }
        balances:
          type: array
          items: { $ref: '#/components/schemas/AccountBalanceLine' }
        signers:
          type: array
          items: { $ref: '#/components/schemas/AccountSigner' }
        data:
          type: object
          additionalProperties: { type: string }
        num_sponsoring: { type: integer }
        num_sponsored: { type: integer }
        sponsor: { type: string }
        paging_token: { type: string }
    AccountDetailsResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/AccountDetails'

