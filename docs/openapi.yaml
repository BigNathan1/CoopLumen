openapi: 3.0.3
info:
  title: CoopLumen API
  description: REST API for CoopLumen communities and Stellar assets.
  version: 0.1.0
servers:
  - url: http://localhost:4000

tags:
  - name: Tokens
    description: Community token metadata and operations

paths:
  /api/v1/tokens/{assetCode}/{issuer}:
    get:
      tags: [Tokens]
      summary: Get token metadata
      description: Returns the off-chain metadata for one Stellar custom asset.
      parameters:
        - name: assetCode
          in: path
          required: true
          description: Stellar asset code.
          schema:
            type: string
            pattern: '^[A-Za-z0-9]{1,12}$'
        - name: issuer
          in: path
          required: true
          description: Stellar public key of the asset issuer.
          schema:
            type: string
            pattern: '^G[A-Z2-7]{55}$'
      responses:
        '200':
          description: Token metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenMetadataResponse'
        '400':
          description: Invalid asset code or issuer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Token not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    TokenMetadata:
      type: object
      required: [asset_code, asset_issuer]
      properties:
        id:
          type: string
        community_id:
          type: string
          format: uuid
        asset_code:
          type: string
        asset_issuer:
          type: string
        name:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    TokenMetadataResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/TokenMetadata'
    ErrorResponse:
      type: object
      required: [data, error]
      properties:
        data:
          nullable: true
        meta:
          type: object
          additionalProperties: true
        error:
          type: string
