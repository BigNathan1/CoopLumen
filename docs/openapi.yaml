openapi: 3.0.3
info:
  title: CoopLumen API — Communities
  description: REST API for managing CoopLumen communities, including soft deletion.
  version: 0.1.0
  license:
    name: MIT

servers:
  - url: http://localhost:4000
    description: Local development

tags:
  - name: Communities
    description: Community registration and management

paths:
  /api/v1/communities/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Community UUID.
        schema:
          type: string
          format: uuid
    delete:
      tags: [Communities]
      summary: Soft-delete a community
      description: Sets deleted_at on the community. Deleted communities are excluded from subsequent reads and listings.
      responses:
        '200':
          description: Community soft-deleted
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [deleted]
                    properties:
                      deleted:
                        type: boolean
                        example: true
        '400':
          description: Invalid community UUID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Community not found or already deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
        meta:
          type: object
          additionalProperties: true
