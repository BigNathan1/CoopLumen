/api/v1/transactions/submit:
    post:
      tags: [Transactions]
      summary: Submit a signed Stellar transaction
      description: Accepts a base64-encoded signed XDR string (typically from Freighter) and submits it to Horizon. Maps Horizon errors to actionable client messages.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [xdr]
              properties:
                xdr:
                  type: string
                  description: The signed transaction envelope XDR
                  example: "AAAAAgAAA..."
      responses:
        '200':
          description: Transaction successfully submitted
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      hash: { type: string }
                      ledger: { type: integer }
                      status: { type: string }
                  meta:
                    type: object
                    properties:
                      timestamp: { type: string }
        '400':
          description: Validation error or Horizon transaction rejection (e.g., bad sequence, insufficient funds)
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      message: { type: string }
                      rawCode: { type: string }
                      details: { type: object }