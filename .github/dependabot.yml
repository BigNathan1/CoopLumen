version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/backend'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 10
    groups:
      # Cut PR noise: patch/minor bumps land as one PR per ecosystem instead
      # of one per package. Majors still get their own PR since those need a
      # human to actually read the changelog.
      minor-and-patch:
        update-types: ['minor', 'patch']

  - package-ecosystem: 'npm'
    directory: '/frontend'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types: ['minor', 'patch']

  - package-ecosystem: 'docker'
    directory: '/backend'
    schedule:
      interval: 'weekly'

  - package-ecosystem: 'docker'
    directory: '/frontend'
    schedule:
      interval: 'weekly'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
