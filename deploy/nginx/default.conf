# Reverse proxy for the blue/green API deploy (docker-compose.prod.yml).
#
# active.conf is a single line, `server backend-blue:4000;` or
# `server backend-green:4000;`, rewritten by scripts/deploy/deploy.sh. A
# graceful `nginx -s reload` starts new workers on the new upstream while the
# old workers finish their in-flight requests, which is what makes the switch
# lossless.

upstream api {
    include /etc/nginx/upstream/active.conf;
    keepalive 16;
}

server {
    listen 80;

    # Answered by nginx itself so the proxy can be probed without touching the API.
    location = /nginx-health {
        access_log off;
        return 200 'ok';
    }

    location / {
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Retry once on another attempt if the upstream resets a connection
        # mid-switch; never replay non-idempotent requests.
        proxy_next_upstream error timeout;
        proxy_next_upstream_tries 2;
    }
}
